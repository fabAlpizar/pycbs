name: pyCBS
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # basics
  - numpy
  - scipy
  - pandas
  - tqdm
  - click
  - ipython
  - pyscf         # conda-forge provides pyscf builds
  # argparse is part of stdlib — remove it

  # development/test (optional; consider a separate env for dev)
  - jupyterlab
  - pytest
  - pytest-cov
  - tox
  - pre-commit
  - nbstripout
  - sphinx
  - nbdime

  - pip:
    - -e .        # install package in editable mode
